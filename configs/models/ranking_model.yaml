ranking_metric:
  class_path: comet.models.RankingMetric
  init_args:
    nr_frozen_epochs: 0.1
    keep_embeddings_frozen: True
    optimizer: AdamW
    encoder_learning_rate: 1.0e-05
    learning_rate: 1.5e-05
    layerwise_decay: 0.95
    encoder_model: Universal
    pretrained_model: cis-lmu/glot500-base
    pool: avg
    layer: mix
    layer_transformation: softmax
    layer_norm: True
    dropout: 0.1
    batch_size: 8
    train_data: 
      - data/1719-daRR.csv
    validation_data:
      - data/2020-daRR.csv
      
trainer: ../trainer.yaml
early_stopping: ../early_stopping.yaml
model_checkpoint: ../model_checkpoint.yaml